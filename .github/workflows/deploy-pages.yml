name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WaterMark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WaterMark/package-lock.json
      - run: npm ci
      # base_path is empty with the custom domain (watermark.works) and /WaterMark on levialabs.github.io
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_MOJOAUTH_API_KEY: ${{ vars.VITE_MOJOAUTH_API_KEY }}
          VITE_WATERMARK_AUTH_VERIFY_URL: ${{ vars.VITE_WATERMARK_AUTH_VERIFY_URL }}
          VITE_WATERMARK_ALERTS_URL: ${{ vars.VITE_WATERMARK_ALERTS_URL }}
          VITE_AGENTBOXD_AUTH_URL: ${{ vars.VITE_AGENTBOXD_AUTH_URL }}
          # Public function URL. Empty: the chat says it is not set up and calls nothing.
          VITE_WATERMARK_ASSISTANT_URL: ${{ vars.VITE_WATERMARK_ASSISTANT_URL }}
          VITE_WATERMARK_TTS_URL: ${{ vars.VITE_WATERMARK_TTS_URL }}
          # Public function URL. Empty: the flood outlook shows its figures and no AI summary.
          VITE_WATERMARK_SUMMARY_URL: ${{ vars.VITE_WATERMARK_SUMMARY_URL }}
      # SPA fallback so /map, /login, /signup work on refresh
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: WaterMark/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

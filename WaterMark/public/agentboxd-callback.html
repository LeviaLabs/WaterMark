<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Finishing sign-in · WaterMark</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #03101c; color: #e6f1f7; font: 16px/1.5 system-ui, sans-serif; }
      a { color: #7fd3ff; }
    </style>
  </head>
  <body>
    <p role="status">Finishing sign-in…</p>
    <noscript><p>Sign-in needs JavaScript. <a href="./login">Back to log in</a></p></noscript>
    <script>
      // Sign in with Agentboxd lands here (WM-CLAUDE-005). It is a real file, so GitHub Pages
      // answers 200 at this exact redirect URI instead of relying on the 404.html SPA fallback.
      // It does no verification: it hands the query (code, state, iss or error) to the app in
      // this tab's sessionStorage, where /login checks it against the attempt this tab started,
      // and replaces the URL so the code is not kept in history or sent as a referrer.
      try {
        sessionStorage.setItem('wm-agentboxd-callback', location.search.slice(1, 4097))
      } catch (e) {}
      location.replace('./login')
    </script>
  </body>
</html>
